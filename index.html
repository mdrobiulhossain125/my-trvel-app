function vPlan(){return `<h1>Travel Planner</h1><p class="sub">Plan future Bangladesh trips and tick off destinations as you go.</p>
<details class="card" ${PL.length?'':'open'}><summary style="cursor:pointer;font-weight:600">+ Create Travel Plan</summary><form id="pf"><label>Trip name</label><input name="title" required maxlength="80" placeholder="Cox's Bazar Weekend"><div class="row"><div><label>Start date</label><input type="date" name="start"></div><div><label>End date</label><input type="date" name="end"></div></div><label>Status</label><select name="status"><option value="planning">Planning</option><option value="upcoming">Upcoming</option><option value="completed">Completed</option></select><label>Notes</label><input name="notes" placeholder="Beach + hiking + local food"><p><button class="b">Create plan</button></p></form></details>
${PL.length?PL.map(p=>{const dn=p.dest.filter(x=>x.done).length;return `<div class="card"><div class="row"><div style="flex:2 1 200px"><h2 style="margin:0">${esc(p.title)}</h2><span class="sub">${fd(p.start)} – ${fd(p.end)}</span>${p.notes?`<br><span class="sub">${esc(p.notes)}</span>`:''}</div><select data-a="pst" data-p="${p.id}" style="max-width:150px">${['planning','upcoming','completed'].map(x=>`<option ${p.status===x?'selected':''} value="${x}">${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select><button class="g d" data-a="dp" data-p="${p.id}">Delete</button></div>
<p class="sub" style="margin:10px 0 0">Trip progress: ${dn} / ${p.dest.length} destinations completed</p><div class="bar"><i style="width:${p.dest.length?dn/p.dest.length*100:0}%"></i></div>
<div class="tl">${p.dest.map(x=>`<div class="dst"><div class="row"><label class="chk" style="margin:0;flex:2 1 150px"><input type="checkbox" data-a="pdd" data-k="done" data-p="${p.id}" data-d="${x.id}" ${x.done?'checked':''}> <b>${esc(x.name)}</b></label><input type="date" data-a="pdd" data-k="date" data-p="${p.id}" data-d="${x.id}" value="${esc(x.date)}" aria-label="Date"><button class="g d" data-a="dd" data-p="${p.id}" data-d="${x.id}" aria-label="Remove destination">✕</button></div><input data-a="pdd" data-k="act" data-p="${p.id}" data-d="${x.id}" value="${esc(x.act)}" placeholder="Activities (e.g. Beach, sunset, local food)"></div>`).join('')||'<p class="sub">No destinations yet.</p>'}</div>
<div class="row"><select id="ad${p.id}">${DS.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><button class="g" data-a="adst" data-p="${p.id}">+ Add destination</button></div></div>`}).join(''):`<div class="card"><h2>You don't have any travel plans yet.</h2><p class="sub">Create Your First Trip above.</p></div>`}`}
function exGrid(){const m=DS.filter(d=>(!U.eq||d.name.toLowerCase().includes(U.eq.toLowerCase()))&&(!U.ed||d.division===U.ed)&&(U.ev!=='v'||V[d.id])&&(U.ev!=='u'||!V[d.id]));
return m.length?m.map(d=>`<div class="card"><b>${esc(d.name)}</b><br><span class="sub">${d.division} Division</span><br>${V[d.id]?'<span class="ok">✓ Visited</span>':'<span class="sub">Not visited</span>'}<div class="row" style="margin-top:8px"><button class="g" data-a="tog" data-id="${d.id}">${V[d.id]?'Unmark':'Mark visited'}</button><button class="g" data-a="qa" data-id="${d.id}">+ Add to trip</button></div></div>`).join(''):'<p class="sub">No districts match.</p>'}
function vExplore(){return `<h1>Explore Bangladesh</h1><p class="sub">All 64 districts, searchable.</p><div class="row" style="margin-bottom:14px"><input id="eq" placeholder="Search districts..." value="${esc(U.eq)}" aria-label="Search districts"><select data-a="exf" data-k="ed"><option value="">All divisions</option>${DVS.map(x=>`<option ${U.ed===x?'selected':''}>${x}</option>`).join('')}</select><select data-a="exf" data-k="ev">${[['','All'],['v','Visited'],['u','Not visited']].map(x=>`<option value="${x[0]}" ${U.ev===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="cards" id="eg">${exGrid()}</div>`}
function vSet(){const c=col(),cp=(k,l)=>`<div><label>${l}</label><input type="color" data-a="pref" data-k="${k}" value="${c[k]}"></div>`;
return `<h1>Settings</h1><div class="card"><h2>Map appearance</h2><div class="sw">${Object.entries(TH).map(([k,t])=>`<button data-a="theme" data-k="${k}" class="${P.theme===k?'on':''}"><i style="background:${t[3]}"></i>${t[0]}</button>`).join('')}</div><div class="row">${cp('vis','Visited color')}${cp('unv','Unvisited color')}${cp('bor','Border color')}${cp('bg','Background')}</div>
<label class="chk"><input type="checkbox" data-a="pref" data-k="labels" ${P.labels?'checked':''}> Show district names</label><label class="chk"><input type="checkbox" data-a="pref" data-k="legend" ${P.legend?'checked':''}> Show legend</label><p><button class="g" data-a="reset">Reset customization</button></p></div>
<div class="card"><h2>Travel data</h2><div class="row"><button class="g" data-a="jex">Export my data (JSON)</button><button class="g" data-a="jim">Import data</button><button class="g d" data-a="clearall">Clear all data</button></div><input type="file" id="jf" accept=".json,application/json" hidden></div>
<div class="card"><h2>About</h2><p class="sub">Bangladesh Travel Map · Version 1.0.0 · Your data stays in this browser (localStorage).</p></div>`}
function vExp(){const o=U.eo,ck=(k,l)=>`<label class="chk"><input type="checkbox" data-a="eo" data-k="${k}" ${o[k]?'checked':''}> ${l}</label>`;
return `<div class="ov" data-a="xexp"><div class="md" role="dialog" aria-modal="true" aria-label="Download your travel map"><h2>Download your travel map</h2><label>Title</label><input data-a="eo" data-k="title" value="${esc(o.title)}" maxlength="60">${ck('stats','Include statistics')}${ck('legend','Include legend')}${ck('names','Include district names')}<label>Background</label><select data-a="eo" data-k="bg">${[['white','White'],['theme','Theme'],['clear','Transparent (PNG)']].map(x=>`<option value="${x[0]}" ${o.bg===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>
<div class="row" style="margin-top:14px"><button class="b" data-a="dl" data-f="png">PNG</button><button class="b" data-a="dl" data-f="jpg">JPG</button><button class="b" data-a="dl" data-f="pdf">PDF</button><button class="g" data-a="xexp">Close</button></div></div></div>`}
const ttl=()=>U.nm.trim()?U.nm.trim()+"'s Bangladesh":'My Bangladesh';
function chips(){const q=U.q.toLowerCase();return DVS.map(dv=>{const L=DS.filter(d=>d.division===dv),n=L.filter(d=>V[d.id]).length,M=L.filter(d=>d.name.toLowerCase().includes(q));return M.length?`<div class="dh"><b>${dv} <span class="sub">${n}/${L.length}</span></b><button data-a="dsel" data-d="${dv}">${n===L.length?'Clear':'Select all'}</button></div><div class="chips" style="margin-top:8px">${M.map(d=>`<button class="chip2 ${V[d.id]?'on':''}" data-a="tog" data-id="${d.id}" aria-pressed="${!!V[d.id]}">${V[d.id]?'● ':''}${esc(d.name)}</button>`).join('')}</div>`:''}).join('')||'<p class="sub">No district found.</p>'}
function vHome(){const s=st(),c=col();
return `<section class="hero"><span class="pill">64 districts · 8 divisions</span><h1>Where have you travelled in <em>Bangladesh</em>?</h1><p>Select the districts you've visited, pick a colour theme, and download a beautiful map of your journey.</p><a class="cta" href="#tool">Start selecting ↓</a><div class="steps"><span>① Select districts</span><span>② Pick a theme</span><span>③ Download PNG, JPG or PDF</span></div></section>
<div class="hg" id="tool"><div class="card"><div class="row" style="flex-wrap:nowrap;margin-bottom:10px"><h2 style="margin:0;flex:1">Districts I've visited</h2><span class="tag">${s.n} / 64</span></div><input id="q" placeholder="Search district..." value="${esc(U.q)}" aria-label="Search district"><div class="row" style="margin:8px 0"><button class="g" data-a="sall">Select all</button><button class="g" data-a="sclr">Clear</button></div><div class="scroll" id="chips">${chips()}</div></div>
<div class="card"><div class="dots"><span class="sub">Theme</span>${Object.entries(TH).map(([k,t])=>`<button class="dot ${P.theme===k?'on':''}" title="${t[0]}" aria-label="${t[0]} theme" data-a="theme" data-k="${k}" style="background:linear-gradient(135deg,${t[2]} 50%,${t[3]} 50%)"></button>`).join('')}</div>
<div class="row" style="margin:12px 0"><input id="nm" placeholder="Your name (optional)" value="${esc(U.nm)}" maxlength="30" aria-label="Your name"><label class="chk" style="margin:0;flex:0 0 auto"><input type="checkbox" data-a="pref" data-k="labels" ${P.labels?'checked':''}> District names</label></div>
<div class="exc" style="background:${c.bg};color:${c.txt}"><div class="top"><div><span style="font-size:13px;opacity:.7">Bangladesh travel map</span><h2 id="ttl">${esc(ttl())}</h2></div><div class="big">${s.n}<span style="font-size:.4em;opacity:.6">/64</span></div></div><div id="svgw" style="margin:14px 0">${mapSVG()}</div><div class="bar" style="background:rgba(0,0,0,.1)"><i style="width:${s.pct}%;background:${c.vis}"></i></div><div class="row" style="font-size:13px;flex-wrap:nowrap;justify-content:space-between"><b>${s.pct}% of Bangladesh explored</b><span style="opacity:.7">${s.ex} of 8 divisions</span></div><p style="text-align:center;font-size:12px;opacity:.6;margin:12px 0 0">Created with Bangladesh Travel Map</p></div>
<p class="sub" style="text-align:center;font-size:12px;margin:8px 0">Tip: click districts on the map to select them too. Boundaries are traced from an illustration and approximate.</p>
<h2 style="margin-top:14px">Download your map</h2><div class="dls"><button data-a="dl" data-f="png">↓ PNG</button><button data-a="dl" data-f="jpg">↓ JPG</button><button data-a="dl" data-f="pdf">↓ PDF</button></div></div></div>`}
// ===== export =====
function expSVG(){const c=col(),o=U.eo,s=st(),bg=o.bg==='white'?'#ffffff':o.bg==='theme'?c.bg:null,tc=o.bg==='theme'?c.txt:'#1d2a22',F='font-family="Georgia,serif" text-anchor="middle" fill="'+tc+'"';
return `<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">${bg?`<rect width="1000" height="1000" fill="${bg}"/>`:''}<text x="500" y="68" font-size="40" font-weight="700" ${F}>${esc(ttl())}</text>${o.stats?`<text x="500" y="102" font-size="20" opacity=".75" ${F}>${s.n} of 64 districts visited · ${s.pct}% explored</text>`:''}<g transform="translate(214,125) scale(.706) translate(-14,-6)">${tiles({x:1,n:P.labels})}</g>${o.legend?`<rect x="360" y="926" width="18" height="18" rx="4" fill="${c.vis}"/><text x="386" y="941" font-size="16" fill="${tc}" font-family="sans-serif">Visited</text><rect x="500" y="926" width="18" height="18" rx="4" fill="${c.unv}" stroke="${c.bor}"/><text x="526" y="941" font-size="16" fill="${tc}" font-family="sans-serif">Not visited</text>`:''}<text x="500" y="982" font-size="14" opacity=".6" ${F}>Created with Bangladesh Travel Map</text></svg>`}
async function dl(f){try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(expSVG())});const k=3,cv=document.createElement('canvas');cv.width=1000*k;cv.height=1000*k;const x=cv.getContext('2d');if(f!=='png'||0){if(f!=='png'||false){}}if(f!=='png'){x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height)}x.drawImage(img,0,0,cv.width,cv.height);
if(f==='pdf'){if(!window.jspdf)throw 0;const p=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'}),h=196,w=h;p.addImage(cv.toDataURL('image/png'),'PNG',(297-w)/2,7,w,h);p.save('bangladesh-travel-map.pdf')}else{const u=cv.toDataURL(f==='jpg'?'image/jpeg':'image/png',.95);file(u,'bangladesh-travel-map.'+f)}toast('Map downloaded.')}catch{toast("Sorry, the export didn't work. Please try again.")}}
function file(u,n){const a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove()}
function addPlan(p){PL.unshift(Object.assign({id:'p'+Date.now(),title:'Untitled trip',start:'',end:'',status:'planning',notes:'',dest:[],created:Date.now()},p));save()}
function addDest(pid,did){const p=PL.find(x=>x.id===pid),d=B[did];if(!p||!d)return toast('That district could not be found.');if(p.dest.some(x=>x.did===did))return toast(d.name+' is already in this plan.');p.dest.push({id:'d'+Date.now()+Math.random().toString(36).slice(2,5),did,name:d.name,date:'',act:'',done:false});save();return 1}
// ===== render =====
function render(){const s=st();$('#cnt').textContent=s.n+'/64 visited';$('#nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-t="${t[0]}" class="${U.tab===t[0]?'on':''}" ${U.tab===t[0]?'aria-current="page"':''}>${t[1]}</button>`).join('');
$('#app').innerHTML=({map:vHome,travel:vTravel,plan:vPlan,explore:vExplore,set:vSet})[U.tab]()+(U.exp?vExp():'')}
// ===== events =====
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;if(a==='xexp'&&e.target!==t)return;
if(['pdd','eo','pref','flt','exf','sort','pst'].includes(a)||t.tagName==='SELECT'||(t.tagName==='INPUT'&&t.type!=='checkbox'&&0))return;
if(a==='tab'){U.tab=t.dataset.t;U.exp=false;scrollTo(0,0)}else if(a==='sel'){U.sel=id;U.tab='map'}else if(a==='open'){U.sel=id;U.tab='map';scrollTo(0,0)}else if(a==='close')U.sel=null;
else if(a==='tog')return toggle(id);else if(a==='theme'){P.theme=t.dataset.k;delete P.vis;delete P.unv;delete P.bor;delete P.bg;save()}
else if(a==='dsel'){const L=DS.filter(d=>d.division===t.dataset.d),all=L.every(d=>V[d.id]);L.forEach(d=>all?delete V[d.id]:V[d.id]=V[d.id]||Date.now());save()}
else if(a==='sall'){DS.forEach(d=>V[d.id]=V[d.id]||Date.now());save()}else if(a==='sclr'){if(confirm('Unmark all districts?')){V={};save()}}
else if(a==='qa'){if(!PL.length){addPlan({title:B[id].name+' Trip'});addDest(PL[0].id,id);toast('Created a new plan with '+B[id].name+'.')}else if(addDest(PL[0].id,id))toast('Added to "'+PL[0].title+'".')}
else if(a==='exp')U.exp=true;else if(a==='xexp')U.exp=false;else if(a==='dl')return dl(t.dataset.f);
else if(a==='addp'){const v=$('#psel').value;if(v==='new'||!PL.length){addPlan({title:B[id].name+' Trip'});addDest(PL[0].id,id);toast('Created a new plan with '+B[id].name+'.')}else if(addDest(v,id))toast('Added '+B[id].name+' to your plan.')}
else if(a==='clear'){if(confirm('Are you sure you want to clear your travel history? This will unmark all 64 districts.')){V={};save()}}
else if(a==='clearall'){if(confirm('Delete ALL data (visited districts, plans, preferences)? This cannot be undone.')){V={};PL=[];P={theme:'classic',labels:false,legend:true};save()}}
else if(a==='reset'){P={theme:'classic',labels:false,legend:true};save()}
else if(a==='dp'){if(confirm('Delete this travel plan?')){PL=PL.filter(x=>x.id!==t.dataset.p);save()}}
else if(a==='dd'){if(confirm('Remove this destination?')){const p=PL.find(x=>x.id===t.dataset.p);p.dest=p.dest.filter(x=>x.id!==t.dataset.d);save()}}
else if(a==='adst'){addDest(t.dataset.p,$('#ad'+t.dataset.p).value)}
else if(a==='jex'){file('data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({app:'bangladesh-travel-map',version:1,visited:V,preferences:P,plans:PL},null,2)),'bangladesh-travel-map.json')}
else if(a==='jim')return $('#jf').click();render()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.t')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.key==='Escape'&&U.exp){U.exp=false;render()}if(e.key==='Enter'&&e.target.id==='q'){const m=DS.find(match);if(m){U.sel=m.id;render()}}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){U.q=t.value;$('#svgw').innerHTML=mapSVG();$('#chips').innerHTML=chips()}else if(t.id==='nm'){U.nm=t.value;$('#ttl').textContent=ttl()}else if(t.id==='eq'){U.eq=t.value;$('#eg').innerHTML=exGrid()}else if(t.dataset.a==='eo'&&t.type!=='checkbox'&&t.tagName!=='SELECT')U.eo[t.dataset.k]=t.value});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a,k=t.dataset.k;if(t.id==='jf')return imp(t);if(!a)return;
if(a==='flt'){U[k]=t.value}else if(a==='exf'){U[k]=t.value}else if(a==='sort')U.sort=t.value;else if(a==='eo'){U.eo[k]=t.type==='checkbox'?t.checked:t.value;return}
else if(a==='pref'){P[k]=t.type==='checkbox'?t.checked:t.value;save()}else if(a==='pst'){PL.find(x=>x.id===t.dataset.p).status=t.value;save()}
else if(a==='pdd'){const x=PL.find(p=>p.id===t.dataset.p)?.dest.find(d=>d.id===t.dataset.d);if(x){x[k]=k==='done'?t.checked:t.value;save()}}else return;render()});
document.addEventListener('submit',e=>{if(e.target.id!=='pf')return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.title.trim())return toast('Please enter a trip name.');if(f.start&&f.end&&f.end<f.start)return toast('The end date must be on or after the start date.');addPlan(f);toast('Travel plan created.');render()});
function imp(inp){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j.visited!=='object'||!Array.isArray(j.plans))throw 0;const v={};for(const k in j.visited)if(B[k])v[k]=+j.visited[k]||Date.now();const pl=j.plans.filter(p=>p&&typeof p.title==='string'&&Array.isArray(p.dest)).map(p=>({id:String(p.id||'p'+Math.random()),title:p.title,start:p.start||'',end:p.end||'',status:p.status||'planning',notes:p.notes||'',created:p.created||Date.now(),dest:p.dest.filter(d=>B[d.did]).map(d=>({id:String(d.id||Math.random()),did:d.did,name:B[d.did].name,date:d.date||'',act:d.act||'',done:!!d.done}))}));V=v;PL=pl;if(j.preferences&&TH[j.preferences.theme])P=Object.assign(P,j.preferences);save();toast('Data imported.');render()}catch{toast("That file doesn't look like valid Bangladesh Travel Map data.")}inp.value=''};r.readAsText(inp.files[0])}
render();
</script></body></html>
